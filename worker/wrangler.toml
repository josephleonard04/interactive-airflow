# The public goal parser. See worker/README.md for the two commands that put it
# live; nothing here contains a secret.

name = "interactive-airflow-goal-parser"
main = "src/index.js"
compatibility_date = "2026-01-15"

# Per-IP and per-day budgets live in KV. Create it once with
#   npx wrangler kv namespace create BUDGET
# and paste the id it prints here. Without this binding the Worker still runs,
# but with NO spending cap — see checkBudget().
# [[kv_namespaces]]
# binding = "BUDGET"
# id = "paste-the-id-here"

# Which model reads the sentence. "anthropic" (default) uses the model named in
# ../shared/goal-contract.json — Claude Haiku 4.5 — with an ANTHROPIC_API_KEY
# secret. "openai" uses OPENAI_MODEL with an OPENAI_API_KEY secret; note that an
# OpenAI API key is billed separately from any ChatGPT subscription.
#   npx wrangler secret put ANTHROPIC_API_KEY
#   npx wrangler secret put OPENAI_API_KEY
[vars]
LLM_PROVIDER = "anthropic"
# OPENAI_MODEL = "gpt-4.1-mini"

[observability]
enabled = true
