# The public goal parser. See worker/README.md for the two commands that put it
# live; nothing here contains a secret.

name = "interactive-airflow-goal-parser"
main = "src/index.js"
compatibility_date = "2026-01-15"

# Per-IP and per-day budgets live in KV. Create it once with
#   npx wrangler kv namespace create BUDGET
# and paste the id it prints here. Without this binding the Worker still runs,
# but with NO spending cap — see checkBudget().
# [[kv_namespaces]]
# binding = "BUDGET"
# id = "paste-the-id-here"

# Which model reads the sentence.
#
#   "anthropic"   (current) Claude Haiku 4.5, the model named in
#                 shared/goal-contract.json. Best quality; needs credit on an
#                 Anthropic account and an ANTHROPIC_API_KEY secret.
#   "workers-ai"  FREE. Cloudflare's own models, 10,000 Neurons/day at no charge,
#                 no API key of any kind — just uncomment the [ai] binding below.
#                 An 8B open model reads less well than Haiku; it is only ever
#                 the fallback behind the offline dictionary, and everything it
#                 returns is validated against the floor plan.
#   "openai"      OPENAI_MODEL, default gpt-4.1-mini. Needs an OpenAI API key,
#                 which is billed separately from any ChatGPT subscription.
#
#   npx wrangler secret put ANTHROPIC_API_KEY
#   npx wrangler secret put OPENAI_API_KEY
[vars]
LLM_PROVIDER = "anthropic"
# WORKERS_AI_MODEL = "@cf/meta/llama-3.1-8b-instruct"
# OPENAI_MODEL = "gpt-4.1-mini"

# Required by LLM_PROVIDER = "workers-ai". Binding it costs nothing and is
# harmless on the other providers, so it stays on either way.
[ai]
binding = "AI"

[observability]
enabled = true
