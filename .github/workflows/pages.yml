# Publish the app to GitHub Pages on every push to main.
#
# The point is that a participant needs a URL, not a checkout. They open the
# link on their own computer, whenever they like; nothing is installed, no
# server of ours has to be awake, and the page cannot go stale because this
# rebuilds it from main every time.
#
# ONE-TIME SETUP (has to be done in the browser, once):
#   Settings -> Pages -> Build and deployment -> Source: "GitHub Actions"
# After that the URL is https://<user>.github.io/<repo>/ and this keeps it fresh.
#
# Optional: set a LOG_ENDPOINT repository secret and finished sessions are POSTed
# there as well as downloaded. Without it Submit simply downloads the file, which
# is the normal path — these sessions are run with a facilitator who asks for it.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a run finish rather than cancelling it; queue anything that arrives mid-deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Build
        env:
          VITE_LOG_ENDPOINT: ${{ secrets.LOG_ENDPOINT }}
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
